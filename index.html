<style>
/* Poker Ledger. One job per screen, the main button in the thumb zone, nothing asked during play.
   A deliberate single dark look (a card room at night), so every color is set explicitly. */
:root{
  --bg:#0e1411; --surface:#151d19; --surface2:#1c2621; --line:#26322c; --line2:#33423a;
  --fg:#ece7d9; --fg2:#c9c4b6; --muted:#93a097; --faint:#66746b;
  --accent:#d9b25c; --accent2:#ecc874; --accent-ink:#1a1407; --accent-dim:#8a7a52;
  --good:#5fc28a; --good-bg:rgba(95,194,138,.14); --bad:#e8746c; --bad-bg:rgba(232,116,108,.13);
  --warn:#e6a94a; --warn-bg:rgba(230,169,74,.13); --mental:#7fb4d6; --mental-bg:rgba(127,180,214,.13);
  --card:#f6f1e4; --card-ink:#1b1b1f; --card-red:#c4362f; --felt:#1b3a2a;
  --scrim:rgba(4,8,6,.7); --pause:#090d0b;
  --display:"Syne","IBM Plex Sans Hebrew",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Hebrew",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html[lang="he"]{ --display:"IBM Plex Sans Hebrew","Syne",ui-sans-serif,system-ui,sans-serif; --body:"IBM Plex Sans Hebrew","IBM Plex Sans",ui-sans-serif,system-ui,sans-serif; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#root{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:22px 116px}
#root.flow{padding-bottom:20px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:28px;line-height:1.15}
h2{font-size:21px;font-weight:700;line-height:1.25}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .fg2{color:var(--fg2)} .small{font-size:14px} .tiny{font-size:12.5px}
.num{font-family:var(--mono);font-feature-settings:"tnum";unicode-bidi:isolate;direction:ltr;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}
.eyebrow{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
html[lang="he"] .eyebrow{letter-spacing:0;font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.top .brand{font-family:var(--display);font-weight:800;font-size:22px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);border-radius:12px;margin-inline-end:-10px}
.iconbtn:hover{color:var(--fg)}
.back{margin-inline-start:-10px;margin-inline-end:0}
html[dir="rtl"] .flipx{transform:scaleX(-1)}
.card{background:var(--surface);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.tight{gap:6px}
.card.link{border:0;text-align:start;width:100%;color:inherit}
.card.link:hover{background:var(--surface2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.row > *{min-width:0}
.stack{display:flex;flex-direction:column;gap:4px;min-width:0}
.gap8{gap:8px}.gap12{gap:12px}
.big{font-family:var(--mono);font-size:40px;font-weight:500;line-height:1.05;letter-spacing:-.02em}
.mid{font-family:var(--mono);font-size:24px;font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:16px;border:1px solid var(--line2);background:transparent;color:var(--fg);font-weight:600;font-size:16px;text-decoration:none;text-align:center}
.btn:hover{background:var(--surface2)}
.btn.primary{min-height:60px;border:0;background:var(--accent);color:var(--accent-ink);font-size:18px;border-radius:18px}
.btn.primary:hover{background:var(--accent2)}
.btn.primary:disabled{background:var(--surface2);color:var(--faint);cursor:default}
.btn.quiet{border:0;color:var(--muted);min-height:48px}
.btn.quiet:hover{color:var(--fg);background:transparent}
.btn.danger{border-color:rgba(232,116,108,.4);color:var(--bad)}
.btn.small{min-height:44px;font-size:15px;padding:0 14px;border-radius:12px}
.btn:disabled{opacity:.55;cursor:default}
#root:not(.flow) .foot{bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:12px}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:8px;position:sticky;bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(14,20,17,0),var(--bg) 22%)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label.f{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted);font-weight:500;min-width:0}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--fg);font-size:17px;min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.inp.money{font-family:var(--mono);font-size:24px;font-weight:500;direction:ltr;text-align:start}
html[dir="rtl"] .inp.money{text-align:right}
.inp.sm{font-size:16px;padding:11px 12px}
textarea.inp{min-height:76px;resize:vertical;font-size:16px}
select.inp{appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--fg);font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.m{color:var(--mental)} .chip.m[aria-pressed="true"]{background:var(--mental);border-color:var(--mental);color:#0a1620}
.chip.light[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.seg .chip{justify-content:center;border-radius:12px;padding:0 8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;border-radius:14px;border:1px solid var(--line2);background:transparent;color:var(--fg);text-align:start;font-size:15.5px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:rgba(217,178,92,.1)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none}
.opt[aria-pressed="true"] .dot{border:6px solid var(--accent)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.badge.good{background:var(--good-bg);color:var(--good)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.mental{background:var(--mental-bg);color:var(--mental)} .badge.plain{background:var(--surface2);color:var(--fg2)}
.note{border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.45;background:var(--surface2);color:var(--fg2)}
.note.warn{background:var(--warn-bg);color:#f0cf98} .note.good{background:var(--good-bg);color:#a9e3c2} .note.bad{background:var(--bad-bg);color:#f3b7b1} .note.mental{background:var(--mental-bg);color:#bcd9ec}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .b{display:grid;grid-template-columns:minmax(0,9fr) minmax(0,10fr) 24px;gap:10px;align-items:center;font-size:13.5px}
.weekbar{display:flex;gap:6px;flex:none}
.weekbar i{width:10px;height:26px;border-radius:3px;background:var(--surface2)}
.weekbar i.ok{background:var(--accent)} .weekbar i.miss{background:var(--bad)} .weekbar i.frz{background:var(--mental)}
.freeze{display:inline-flex;align-items:center;gap:4px;color:var(--mental);font-size:13px;font-weight:600}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--surface2);background:transparent;border-inline:0;border-top:0;width:100%;text-align:start;color:inherit;min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .grow > *{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.li:hover{background:rgba(255,255,255,.02)}
.pcs{display:inline-flex;gap:5px;direction:ltr}
.pc{display:inline-grid;place-items:center;width:42px;height:58px;border-radius:7px;background:var(--card);color:var(--card-ink);font:600 19px var(--mono)}
.pc.r{color:var(--card-red)} .pc.sm{width:30px;height:42px;font-size:14px;border-radius:5px} .pc.back{background:var(--felt);color:transparent}
.board{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.rs{color:#e8746c}
.street{display:flex;gap:12px;font-size:15px;line-height:1.45}
.street .lab{width:54px;flex:none;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
html[lang="he"] .street .lab{letter-spacing:0;font-size:13px}
.street.key .lab{color:var(--accent)}
.street.hid{opacity:.5}
.tabs{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:76px;min-height:52px;justify-content:center;border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:500;position:relative}
.tabs button[aria-current="true"]{color:var(--accent);font-weight:600}
.tabs .dotn{position:absolute;top:4px;inset-inline-end:18px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.pause{position:fixed;inset:0;background:var(--pause);z-index:20;display:flex;justify-content:center;overflow:auto}
.pause .in{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px;padding:calc(64px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.ring{position:relative;width:132px;height:132px;display:grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font:500 44px var(--mono)}
.sheetwrap{position:fixed;inset:0;background:var(--scrim);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92dvh;background:var(--bg);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(18px,env(safe-area-inset-right,0px)) 6px max(18px,env(safe-area-inset-left,0px))}
.sheet .sb{overflow:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet .sf{padding:10px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14.5px;font-weight:500;z-index:30;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.timer{font:500 64px/1 var(--mono);letter-spacing:-.03em;direction:ltr}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:transparent;font-size:20px}
.stepper b{min-width:30px;text-align:center;font:500 20px var(--mono)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .t{width:54px;height:96px;border-radius:8px;background:var(--felt) center/cover;border:1px solid var(--line)}
.thumbs label.t{display:grid;place-items:center;border:1.5px dashed var(--line2);background:transparent;color:var(--muted);font-size:24px;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"− "}
.grid13{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;direction:ltr}
.grid13 button{aspect-ratio:1;border:0;border-radius:3px;font:500 9px var(--mono);padding:0;background:var(--surface2);color:var(--faint)}
.grid13 button.o{background:var(--accent);color:var(--accent-ink)} .grid13 button.m{background:var(--accent-dim);color:#16120a}
.grid13 button.sel{outline:2px solid var(--fg)}
.eqbar{height:10px;border-radius:5px;overflow:hidden;display:flex;background:var(--surface2);direction:ltr}
.pick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;direction:ltr}
.pick button{min-height:42px;border-radius:10px;border:1px solid var(--line2);background:transparent;font:600 16px var(--mono)}
.pick button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.hr{height:1px;background:var(--line);border:0;margin:2px 0}
.status{min-height:70dvh;display:grid;place-items:center;text-align:center}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:var(--accent);animation:sp 0.9s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

const PAUSE_S=15, GRACE_MIN=10, LOOSEN_HOUR=6, SD_BB100=90;

const lsGet=k=>{ try{ const s=localStorage.getItem("pl_"+k); return s?JSON.parse(s):undefined; }catch(e){ return undefined; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem("pl_"+k,JSON.stringify(v)); }catch(e){} };
const IDB={db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open("poker-ledger",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>{ IDB.db=r.result; res(true); }; r.onerror=()=>res(false); r.onblocked=()=>res(false); setTimeout(()=>res(!!IDB.db),2500); }catch(e){ res(false); } }); },
  get(k){ return new Promise(res=>{ if(!IDB.db) return res(lsGet(k)); try{ const q=IDB.db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result===undefined?lsGet(k):q.result); q.onerror=()=>res(lsGet(k)); }catch(e){ res(lsGet(k)); } }); },
  set(k,v){ return new Promise(res=>{ if(!IDB.db){ lsSet(k,v); return res(); } try{ const tx=IDB.db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>{ lsSet(k,v); res(); }; }catch(e){ lsSet(k,v); res(); } }); }
};
const DB={entries:{},dirty:{},since:null,owner:null,shots:[],remoteShots:[]};
let saveT; function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>{ IDB.set("db",{entries:DB.entries,dirty:DB.dirty,since:DB.since,owner:DB.owner}); IDB.set("shots",DB.shots); },120); }
function put(kind,id,data){ id=id||uid(); DB.entries[id]={id,kind,data,updated_at:nowISO(),deleted:false}; DB.dirty[id]=1; persist(); scheduleSync(); return id; }
function patch(id,ch){ const e=DB.entries[id]; if(!e) return; put(e.kind,id,Object.assign({},e.data,ch)); }
function removeEntry(id){ const e=DB.entries[id]; if(!e) return; e.deleted=true; e.updated_at=nowISO(); DB.dirty[id]=1; persist(); scheduleSync(); }
function list(kind){ const out=[]; for(const id in DB.entries){ const e=DB.entries[id]; if(e.kind===kind&&!e.deleted) out.push(Object.assign({id},e.data)); } return out; }
const get=id=>{ const e=DB.entries[id]; return e&&!e.deleted?Object.assign({id},e.data):null; };

const claudeRemote=(()=>{
  let mcp=null;
  const OWNER="select set_config('request.jwt.claim.sub',(select id::text from auth.users order by created_at limit 1),true);";
  function extract(res){
    let p=res&&res.payload;
    if(p&&typeof p==="object"&&!Array.isArray(p)&&"result" in p) p=p.result;
    if(Array.isArray(p)) return p;
    if(p&&typeof p==="object") return p;
    if(typeof p!=="string"){ const b=(res&&res.content||[]).find(x=>x.type==="text"); p=b?b.text:""; }
    if(p.trim().startsWith("{")){ try{ const o=JSON.parse(p); if(o&&typeof o==="object"&&"result" in o){ if(Array.isArray(o.result)) return o.result; p=String(o.result); } }catch(e){} }
    const m=p.match(/<(untrusted-data-[\w-]+)>\s*([\[{][\s\S]*?)\s*<\/\1>/);
    const body=(m?m[2]:p).trim(); if(!body) return [];
    try{ return JSON.parse(body); }catch(e){ throw Object.assign(new Error("Unexpected reply from Supabase"),{code:"parse"}); }
  }
  const q=async s=>{ if(!mcp) throw {code:"not_granted"}; return extract(await mcp.callTool("Supabase","execute_sql",{project_id:CONFIG.projectId,query:OWNER+s},{cache:false})); };
  const one=r=>{ const v=r&&r[0]; if(!v) throw Object.assign(new Error("Empty reply"),{code:"parse"}); return v; };
  return {
    async init(){ try{ mcp=await window.claude.use("mcp"); }catch(e){ mcp=null; } if(!mcp) return null;
      const r=one(await q("select auth.uid() as uid, (select email from auth.users where id=auth.uid()) as email")); return r.uid?{id:r.uid,email:r.email}:null; },
    async sync(items,since){ let d=one(await q(`select public.sync(${lit(JSON.stringify(items))}::jsonb, ${since?lit(since)+"::timestamptz":"null"}) as d`)).d; if(typeof d==="string") d=JSON.parse(d); return d; },
    async uploadShot(){},
    async shotImg(id){ return one(await q(`select img from public.shots where id=${lit(id)}::uuid and user_id=auth.uid()`)).img; },
    async markShot(id,status,hand){ await q(`update public.shots set status=${lit(status)}${status==="read"?", img=null":""}, hand_id=${hand?lit(hand)+"::uuid":"null"} where id=${lit(id)}::uuid and user_id=auth.uid()`); },
    async signOut(){}
  };
})();

let syncT=null, syncing=false, syncAgain=false;
function scheduleSync(ms){ if(!ACC.on) return; clearTimeout(syncT); syncT=setTimeout(sync,ms==null?1500:ms); }
function merge(items){
  for(const it of items||[]){
    const up=new Date(it.updated_at).toISOString(), loc=DB.entries[it.id];
    if(!loc||loc.updated_at<up||(!DB.dirty[it.id]&&loc.updated_at!==up)){ DB.entries[it.id]={id:it.id,kind:it.kind,data:it.data||{},updated_at:up,deleted:!!it.deleted}; delete DB.dirty[it.id]; }
  }
  dedupe();
}
function dedupe(){
  const ps=list("profile").sort((a,b)=>String(a.created||"").localeCompare(String(b.created||"")));
  ps.slice(1).forEach(p=>removeEntry(p.id));
  const seen={};
  list("club").sort((a,b)=>String(a.created||"").localeCompare(String(b.created||""))).forEach(c=>{
    const k=(c.name||"").trim().toLowerCase();
    if(seen[k]){ const keep=seen[k]; ["session","tx","hand"].forEach(kind=>list(kind).filter(x=>x.club===c.id).forEach(x=>patch(x.id,{club:keep}))); removeEntry(c.id); } else seen[k]=c.id; });
}
async function sync(){
  if(!ACC.on) return; if(syncing){ syncAgain=true; return; }
  syncing=true; ACC.state="syncing"; paintSync();
  try{
    const ids=Object.keys(DB.dirty), snap={}; const items=ids.map(id=>{ const e=DB.entries[id]; snap[id]=e.updated_at; return {id,kind:e.kind,data:e.data,updated_at:e.updated_at,deleted:e.deleted}; });
    const r=await remote.sync(items,DB.since);
    ids.forEach(id=>{ if(DB.entries[id]&&DB.entries[id].updated_at===snap[id]) delete DB.dirty[id]; });
    merge(r.items); DB.since=r.now; DB.remoteShots=r.shots||[]; ACC.state="ok"; ACC.last=Date.now(); persist();
    await uploadShots();
    if(!V.busy&&!FLOW.has(V.view)&&!$("sheetWrap")) render();
  }catch(e){ console.error("sync",e); ACC.state="error"; }
  finally{ syncing=false; paintSync(); if(syncAgain){ syncAgain=false; scheduleSync(800); } }
}
async function uploadShots(){
  if(MODE!=="web"||!ACC.on||!DB.shots.length) return;
  for(const s of DB.shots.slice()){ try{ await remote.uploadShot(s); DB.shots=DB.shots.filter(x=>x.id!==s.id); if(!DB.remoteShots.find(x=>x.id===s.id)) DB.remoteShots.push({id:s.id,session_id:s.session,taken_at:s.taken_at,status:"pending"}); persist(); }catch(e){ console.error("upload",e); break; } }
}
function paintSync(){ const el=$("syncState"); if(el) el.innerHTML=syncLine(); }

  if(ACC.state==="error") return t("sync.error");
  return t("sync.ok",{email:esc(ACC.email||"")});
}

async function adoptAccount(user){
  if(!BOOTED) return;
  // A signed-in account appeared. Local records with no owner join it; another owner's local copy is cleared first.
  if(DB.owner&&DB.owner!==user.id){ DB.entries={}; DB.dirty={}; DB.since=null; DB.shots=[]; }
  if(!DB.owner){ for(const id in DB.entries) DB.dirty[id]=1; }
  DB.owner=user.id; ACC.on=true; ACC.uid=user.id; ACC.email=user.email; persist();
  closeSheet(); await sync(); if(V.view==="first"&&prof()) V.view="play"; render(); toast(t("acc.on"));
}

const toCur=(chips,club)=>chips/((club&&Number(club.rate))||1);
function money(chips,club,o){ o=o||{}; const v=toCur(Number(chips)||0,club||clubOf()); const a=Math.abs(v); const s=(v<0?"−":o.sign&&v>0?"+":"")+cur()+(a%1&&a<100?a.toFixed(1):fmtN(a)); return s; }

function clubBalance(c){ return (Number(c.balance0)||0)+sum(txs().filter(x=>x.club===c.id).map(txSigned))+sum(doneS().filter(s=>s.club===c.id).map(net)); }
const totalBalance=()=>sum(clubs().map(c=>toCur(clubBalance(c),c)));
const parseStake=s=>{ const m=String(s||"").replace(/,/g,".").match(/([\d.]+)\s*\/\s*([\d.]+)/); return m?{sb:Number(m[1]),bb:Number(m[2])}:{sb:1,bb:2}; };
const durH=s=>((new Date(s.end||Date.now()))-(new Date(s.start)))/3.6e6;
function evalPlan(s){
  if(!s.plan) return {kept:null,breaks:[]};
  const b=[]; const loss=-net(s);
  if(loss>Number(s.plan.loss)+0.0001) b.push("loss");
  if((s.rebuys||[]).length>Number(s.plan.rebuys)) b.push("rebuys");
  if(s.end&&new Date(s.end)-new Date(s.plan.until)>GRACE_MIN*60000) b.push("time");
  return {kept:!b.length,breaks:b};
}
function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-x.getDay()); return x; }
const weekKey=d=>{ const w=weekStart(d); return w.getFullYear()+"-"+String(w.getMonth()+1).padStart(2,"0")+"-"+String(w.getDate()).padStart(2,"0"); };
function meetsGoal(s){ const g=(prof()||{}).goal||"plan"; if(g==="setplan") return !!s.plan; return !!s.plan&&evalPlan(s).kept===true; }
function streak(){
  // Weekly streak with forgiveness: 2 freezes to start, one earned back per 2 good weeks (max 2). Empty weeks don't count.
  const by={}; doneS().filter(s=>!s.past).forEach(s=>{ const k=weekKey(s.start); (by[k]=by[k]||[]).push(s); });
  const keys=Object.keys(by).sort(); let st=0, frz=2, run=0; const hist=[];
  keys.forEach(k=>{ const ok=by[k].every(meetsGoal);
    if(ok){ st++; run++; if(run%2===0&&frz<2) frz++; hist.push("ok"); }
    else if(frz>0){ frz--; run=0; hist.push("frz"); }
    else { st=0; run=0; hist.push("miss"); } });
  const wk=weekKey(new Date()), thisW=by[wk]||[];
  return {streak:st,freezes:frz,hist,thisWeek:thisW,thisOk:thisW.filter(meetsGoal).length,thisN:thisW.length,thisFroze:thisW.length&&!thisW.every(meetsGoal)};
}
/* limits: tightening counts now, loosening from tomorrow 06:00 */
function limits(){ const p=prof()||{}; return Object.assign({loss_bi:2,hours:2,rebuys:1,dep_week:null},p.limits||{}); }
const LOOSER={loss_bi:(a,b)=>b>a,hours:(a,b)=>b>a,rebuys:(a,b)=>b>a,dep_week:(a,b)=>a!=null&&(b==null||b>a)};
function tomorrow6(){ const d=new Date(); if(d.getHours()>=LOOSEN_HOUR) d.setDate(d.getDate()+1); d.setHours(LOOSEN_HOUR,0,0,0); return d.toISOString(); }
function setLimit(key,val,force){
  const p=prof(); if(!p) return "now"; const lim=limits(), pend=Object.assign({},p.pending||{});
  if(lim[key]===val){ if(pend[key]){ delete pend[key]; patch(p.id,{pending:pend}); } return "same"; }
  if(!force&&LOOSER[key](lim[key],val)){ pend[key]={v:val,from:tomorrow6()}; patch(p.id,{pending:pend}); return "later"; }
  lim[key]=val; delete pend[key]; patch(p.id,{limits:lim,pending:pend}); return "now";
}
function applyPending(){ const p=prof(); if(!p||!p.pending) return; const lim=limits(), pend=Object.assign({},p.pending); let ch=false;
  for(const k in pend){ if(new Date(pend[k].from)<=new Date()){ lim[k]=pend[k].v; delete pend[k]; ch=true; } } if(ch) patch(p.id,{limits:lim,pending:pend}); }

ACT.firstGo=()=>{
  const name=(F.name||"").trim(), bal=num(F.bal), stake=STAKES.includes(F.stake)?F.stake:(F.stakeOther||"").trim(), rate=num(F.rate)>0?num(F.rate):1;
  if(!name||!fin(bal)||!/\d/.test(stake)){ $("firstNeed").hidden=false; return; }
  const {bb}=parseStake(stake), now=nowISO();
  put("profile",null,{created:now,name,lang,currency:"₪",goal:F.goal||"plan",limits:{loss_bi:2,hours:2,rebuys:1,dep_week:null},pending:{},hph:60});
  const cpc=1/rate; put("club",null,{created:now,name:"ClubGG",rate:cpc,stake,buyin:bb*100,balance0:bal*cpc});
  V.tab="play"; go("play",{});
};

VIEWS.play=()=>{

  const weekCard=`<div class="card"><div class="row"><div class="stack"><span class="eyebrow">${t("home.week")}</span>
      <h2>${st.thisN?t(goalSet?"home.weekLineSet":"home.weekLine",{ok:st.thisOk,n:st.thisN}):`<span class="fg2" style="font-size:17px;font-family:var(--body);font-weight:500">${t("home.weekNone")}</span>`}</h2></div>

ACT.start=()=>{ const c=clubOf(), lim=limits(), last=lastDone();
  const stake=last&&last.stake||c.stake; const {bb}=parseStake(stake); const buyin=last&&last.stake===stake?last.buyin:(c.stake===stake?c.buyin:bb*100);
  go("start",{club:(last&&last.club)||c.id,stake,stakeOther:"",buyin:String(toCur(buyin,c)),loss:String(Math.round(toCur(lim.loss_bi*buyin,c))),hours:lim.hours,hoursOther:"",rebuys:lim.rebuys,focus:suggestedFocus(),focusOn:!!suggestedFocus()}); };
function startVals(){ const c=clubOf(F.club), lim=limits();
  const stake=F.stake||F.stakeOther; const {bb}=parseStake(stake); const buyin=(num(F.buyin)>0?num(F.buyin):toCur(bb*100,c))*c.rate;
  const lossWant=(num(F.loss)>0?num(F.loss):toCur(lim.loss_bi*buyin,c))*c.rate;
  const hoursWant=F.hours==="o"?(num(F.hoursOther)>0?num(F.hoursOther):lim.hours):Number(F.hours);
  const rebWant=Number(F.rebuys);
  const capLoss=lim.loss_bi*buyin, fresh=!sessions().some(s=>s.plan);
  // your very first plan sets your limits directly; after that, loosening waits until tomorrow
  const lossLater=!fresh&&lossWant>capLoss+0.5, hoursLater=!fresh&&hoursWant>lim.hours, rebLater=!fresh&&rebWant>lim.rebuys;
  return {c,stake,bb,buyin,lossWant,hoursWant,rebWant,fresh,
    loss:lossLater?capLoss:lossWant, lossLater, hours:hoursLater?lim.hours:hoursWant, hoursLater, rebuys:rebLater?lim.rebuys:rebWant, rebLater};
}
VIEWS.start=()=>{ const v=startVals(), cs=clubs();
  const stakes=STAKES.includes(v.c.stake)?STAKES:[v.c.stake,...STAKES];
  return flowTop("home",t("close"))+`<h1>${t("start.title")}</h1>
  ${cs.length>1?`<div class="stack gap8"><span class="small muted">${t("start.club")}</span><div class="chips">${cs.map(c=>chip("sclub",c.id,esc(c.name),F.club===c.id)).join("")}</div></div>`:""}
  <div class="stack gap8"><span class="small muted" style="font-weight:500">${t("start.stake")}</span><div class="chips">${stakes.map(s=>chip("sstake",s,`<bdi class="num">${esc(s)}</bdi>`,F.stake===s)).join("")}${chip("sstake","",t("other"),!F.stake)}</div>
    ${!F.stake?`<input class="inp sm" data-f="stakeOther" placeholder="10/20" value="${esc(F.stakeOther)}">`:""}</div>
  <div class="duo"><label class="f">${t("start.buyin")}<input class="inp money" data-f="buyin" inputmode="decimal" value="${esc(F.buyin)}"></label>
    <label class="f">${t("start.loss")}<input class="inp money" data-f="loss" inputmode="decimal" value="${esc(F.loss)}"></label></div>
  <span class="tiny muted" id="lossHint" style="margin-top:-8px">${lossHint(v)}</span>
  <div class="stack gap8"><span class="small muted" style="font-weight:500">${t("start.time")}</span><div class="seg">${[1.5,2,3].map(h=>chip("shours",h,`<bdi class="num">${hrsTxt(h)}</bdi>`,Number(F.hours)===h&&F.hours!=="o")).join("")}${chip("shours","o",t("other"),F.hours==="o"||![1.5,2,3].includes(Number(F.hours)))}</div>
    ${F.hours==="o"||![1.5,2,3].includes(Number(F.hours))?`<label class="row" style="justify-content:flex-start;gap:8px"><input class="inp sm" style="width:90px" data-f="hoursOther" inputmode="decimal" value="${esc(F.hoursOther||(F.hours!=="o"?F.hours:""))}"><span class="small muted">${t("h")}</span></label>`:""}</div>
  <div class="row"><span class="small" style="font-weight:500">${t("start.rebuys")}</span><span class="stepper"><button data-act="sreb" data-v="-1" aria-label="−">−</button><b>${F.rebuys}</b><button data-act="sreb" data-v="1" aria-label="+">+</button></span></div>
  ${F.focus?`<div class="card tight"><div class="row"><span class="eyebrow">${t("start.focus")}</span>${F.focusOn?`<button class="btn quiet small" style="min-height:32px" data-act="sfocus">${t("start.focusNone")}</button>`:`<button class="btn quiet small" style="min-height:32px;color:var(--accent)" data-act="sfocus">+</button>`}</div>
    ${F.focusOn?`<span style="font-weight:600">${esc(focusText(F.focus))}</span><span class="tiny muted">${t("start.focusFrom",{tag:esc(tagName(F.focus))})}</span>`:""}</div>`:""}
  <div id="looser">${looserNotes(v)}</div>
  <span class="tiny muted">${t("start.rule")}</span>
  <div class="foot"><button class="btn primary" data-act="startGo">${t("start.go")}</button></div>`; };
function lossHint(v){ const bi=v.lossWant/v.buyin; const last=lastDone(); const same=last&&last.plan&&Math.abs(last.plan.loss-v.lossWant)<1; return t(same?"start.lossHint":"start.lossHintNew",{bi:fmt1(bi)}); }
function looserNotes(v){ const out=[];
  if(v.lossLater) out.push(t("start.looser",{what:limitName("loss_bi"),v:money(v.loss,v.c)}));
  if(v.hoursLater) out.push(t("start.looser",{what:limitName("hours"),v:hrsTxt(v.hours)}));
  if(v.rebLater) out.push(t("start.looser",{what:limitName("rebuys"),v:String(v.rebuys)}));
  return out.map(x=>`<div class="note warn">${x}</div>`).join(""); }
ONINPUT.start=f=>{ const v=startVals(); $("looser").innerHTML=looserNotes(v); $("lossHint").textContent=lossHint(v);
  if(f==="buyin"&&!F.lossTouched){ F.loss=String(Math.round(toCur(limits().loss_bi*v.buyin,v.c))); const el=document.querySelector('[data-f="loss"]'); if(el) el.value=F.loss; $("lossHint").textContent=lossHint(startVals()); }
  if(f==="loss") F.lossTouched=true; };
ACT.sclub=b=>{ F.club=b.dataset.v; render(); };
ACT.sstake=b=>{ F.stake=b.dataset.v; const c=clubOf(F.club); if(F.stake){ const {bb}=parseStake(F.stake); F.buyin=String(toCur(bb*100,c)); if(!F.lossTouched) F.loss=String(Math.round(toCur(limits().loss_bi*bb*100,c))); } render(); };
ACT.shours=b=>{ F.hours=b.dataset.v==="o"?"o":Number(b.dataset.v); render(); };
ACT.sreb=b=>{ F.rebuys=Math.max(0,Math.min(9,Number(F.rebuys)+Number(b.dataset.v))); render(); };
ACT.sfocus=()=>{ F.focusOn=!F.focusOn; render(); };
ACT.startGo=()=>{ const v=startVals(); if(!/\d/.test(v.stake)) return toast(t("start.stake")+"?");
  // record standing limits: tighter now, looser from tomorrow
  setLimit("loss_bi",Math.round(v.lossWant/v.buyin*100)/100,v.fresh); setLimit("hours",v.hoursWant,v.fresh); setLimit("rebuys",v.rebWant,v.fresh); V._warned=false;
  const start=new Date(), until=new Date(start.getTime()+v.hours*3.6e6);
  const id=put("session",null,{club:v.c.id,stake:v.stake,sb:parseStake(v.stake).sb*1,bb:v.bb,buyin:v.buyin,start:start.toISOString(),end:null,rebuys:[],
    plan:{loss:v.loss,hours:v.hours,until:until.toISOString(),rebuys:v.rebuys,focus:F.focusOn?F.focus:null,set:start.toISOString()}});
  if(v.c.stake!==v.stake||v.c.buyin!==v.buyin) patch(v.c.id,{stake:v.stake,buyin:v.buyin});
  V.tab="play"; go("live",{}); };

VIEWS.live=()=>{ const s=liveS(); if(!s) return VIEWS.play();
  const c=clubOf(s.club), el=Date.now()-new Date(s.start), plan=s.plan, pct=plan?Math.min(1,el/(plan.hours*3.6e6)):0, left=plan?Math.round((new Date(plan.until)-Date.now())/60000):null;

ACT.rebuy=()=>{ const s=liveS(); if(!s) return; const c=clubOf(s.club);
  openSheet(t("reb.quick"),`<label class="f">${t("reb.amount")}<input class="inp money" id="rebAmt" inputmode="decimal" value="${toCur(s.buyin,c)}"></label>
    ${s.plan?`<span class="tiny muted" id="rebSub"></span>`:""}`,
    `<button class="btn primary" id="rebGo">${t("reb.quickGo")}</button>`,()=>{
      const upd=()=>{ const a=(num($("rebAmt").value)||0)*c.rate; if($("rebSub")) $("rebSub").innerHTML=t("reb.quickSub",{x:M(invested(s)+a,c),lim:M(s.plan.loss,c)}); };
      $("rebAmt").oninput=upd; upd();
      $("rebGo").onclick=()=>{ const a=(num($("rebAmt").value)||0)*c.rate; if(!(a>0)) return; closeSheet(); rebuyCheck(s,a); }; }); };
function rebuyCheck(s,a){
  const c=clubOf(s.club), p=s.plan; if(!p){ addRebuy(s,a,false,""); return; }
  const after=invested(s)+a, k=(s.rebuys||[]).length+1, reasons=[];
  if(Math.abs(after-p.loss)<=0.5) reasons.push(t("reb.at",{x:M(after,c),t:tfmt(p.set||s.start)}));
  else if(after>p.loss+0.5) reasons.push(t("reb.over",{x:M(after,c),lim:M(p.loss,c),t:tfmt(p.set||s.start)}));
  else if(after>=0.8*p.loss) reasons.push(t("reb.80",{x:M(after,c),p:Math.round(after/p.loss*100),lim:M(p.loss,c),t:tfmt(p.set||s.start)}));
  if(k>p.rebuys) reasons.push(p.rebuys===1?t("reb.count1",{k}):p.rebuys===0?t("reb.count0"):t("reb.count",{n:p.rebuys,k}));
  else if(k===p.rebuys&&reasons.length) reasons.push(t("reb.last"));
  if(!reasons.length){ addRebuy(s,a,false,""); return; }
  pauseScreen({lines:reasons,stopLabel:t("reb.stop"),anyLabel:s2=>s2>0?t("reb.anyway",{s:s2}):t("reb.anywayNow"),note:true,
    onStop:note=>{ if(note) patch(s.id,{note:note,note_kind:"stopped"}); go("end",endForm(liveS())); },
    onAny:note=>{ addRebuy(liveS(),a,true,note); }});
}
function addRebuy(s,a,paused,note){ const r=(s.rebuys||[]).concat([{at:nowISO(),amt:a,paused:!!paused,note:note||null}]); patch(s.id,{rebuys:r}); toast(t("reb.logged")); go("live",{}); }
function pauseScreen(o){
  closeSheet(); V.busy=true; let left=PAUSE_S; const d=document.createElement("div"); d.className="pause"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true");
  const C=2*Math.PI*58;
  d.innerHTML=`<div class="in"><div class="ring"><svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="58" fill="none" stroke="#1c2621" stroke-width="8"/><circle id="pRing" cx="66" cy="66" r="58" fill="none" stroke="#d9b25c" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><b id="pNum">${left}</b></div>
    <div class="stack gap12"><h1>${o.title||t("reb.title")}</h1>${o.lines.map(x=>`<p style="font-size:17px;line-height:1.5;color:var(--fg2)">${x}</p>`).join("")}</div>
    <button class="btn primary" style="width:100%" id="pStop">${o.stopLabel}</button>
    ${o.note?`<label class="f" style="width:100%;text-align:start"><span>${t("reb.note")} <span class="tiny">(${t("optional")})</span></span><input class="inp" id="pNote" placeholder="${o.noteQ||t("reb.noteQ")}"></label>`:""}
    <button class="btn quiet" style="margin-top:auto" id="pAny" disabled>${o.anyLabel(left)}</button></div>`;
  document.body.appendChild(d); $("pStop").focus();
  const tick=setInterval(()=>{ left--; $("pNum").textContent=Math.max(0,left); $("pRing").setAttribute("stroke-dashoffset",String(C*(1-Math.max(0,left)/PAUSE_S))); $("pAny").textContent=o.anyLabel(Math.max(0,left)); if(left<=0){ clearInterval(tick); $("pAny").disabled=false; } },1000);
  const close=()=>{ clearInterval(tick); d.remove(); V.busy=false; };
  const note=()=>$("pNote")?$("pNote").value.trim():"";
  $("pStop").onclick=()=>{ const n=note(); close(); o.onStop(n); };
  $("pAny").onclick=()=>{ if(left>0) return; const n=note(); close(); o.onAny(n); };
}

function endForm(s,past){ return {sid:s?s.id:null,past:!!past,cash:"",bal:"",balTouched:false,mm:null,rating:null,focusOk:null,hands:"",shots:[],quick:0}; }
ACT.end=()=>go("end",endForm(liveS()));
function endCalc(){
  const s=F.past?null:get(F.sid); const c=clubOf(F.past?F.club:s.club);
  const cash=num(F.cash)*c.rate, base=clubBalance(c);
  const inv=F.past?(num(F.pin)||0)*c.rate:invested(s);
  let extra=0; const balNum=num(F.bal)*c.rate;
  const expected=base-inv+(fin(cash)?cash:0);
  const diff=F.balTouched&&fin(balNum)&&fin(cash)?balNum-expected:0;
  if(F.mm==="rebuy"&&diff<0) extra=-diff;
  const netv=fin(cash)?cash-inv-extra:null;
  let plan=null; if(s&&s.plan){ const sim=Object.assign({},s,{end:nowISO(),cashout:fin(cash)?cash:0,rebuys:(s.rebuys||[]).concat(extra?[{amt:extra,at:nowISO(),unlogged:true}]:[])}); plan=evalPlan(sim); }
  return {s,c,cash,inv,expected,diff:Math.abs(diff)<0.5?0:diff,extra,net:netv,plan,bb:F.past?parseStake(F.stake).bb:s.bb};
}

  <details class="more"><summary>${t("end.hands")} (${t("optional")})</summary><label class="f" style="margin-top:6px"><input class="inp sm" data-f="hands" inputmode="numeric" value="${esc(F.hands)}" placeholder="—"><span class="tiny muted">${t("end.handsHint")}</span></label></details>

function endResult(e){ if(e.net==null) return "";

  return `<div class="card" style="flex-direction:row;align-items:center;justify-content:space-between"><span class="stack"><span class="mid ${e.net>0?"pos":e.net<0?"":""}">${M(e.net,e.c,{sign:true})}</span><span class="tiny muted">${bbs!=null?`<bdi class="num">${bbs>0?"+":bbs<0?"−":""}${fmtN(Math.abs(bbs))} bb</bdi> · `:""}${t("end.luck")}</span></span>
    ${e.plan?(e.plan.kept?`<span class="badge good">${ICON.check}${t("end.kept")}</span>`:`<span class="badge warn">${t("end.off")}</span>`):""}</div>`; }

ACT.endSave=async()=>{
  const e=endCalc(); const need=$("endNeed");
  if(e.net==null||(F.past&&!(e.inv>0))){ need.textContent=t("end.need"); need.hidden=false; return; }
  if(e.diff&&!F.mm){ need.textContent=t("end.needPick"); need.hidden=false; return; }
  const now=nowISO(); let sid;
  if(F.past){
    const end=pastEnd(), start=new Date(new Date(end)-(Number(F.phours)||2)*3.6e6).toISOString(); const {sb,bb}=parseStake(F.stake);
    sid=put("session",null,{club:e.c.id,stake:F.stake,sb,bb,buyin:e.inv,start,end,rebuys:[],plan:null,past:true,cashout:e.cash,rating:F.rating,hands:num(F.hands)||null,balance_after:F.balTouched?num(F.bal)*e.c.rate:null});
  } else {
    const s=e.s, rebuys=(s.rebuys||[]).concat(e.extra?[{at:now,amt:e.extra,unlogged:true}]:[]);
    const sim=Object.assign({},s,{end:now,cashout:e.cash,rebuys}); const pl=evalPlan(sim);
    patch(s.id,{end:now,cashout:e.cash,rebuys,rating:F.rating,focus_ok:F.focusOk,hands:num(F.hands)||null,balance_after:F.balTouched?num(F.bal)*e.c.rate:null,kept:pl.kept,breaks:pl.breaks});
    sid=s.id;
  }
  if(e.diff&&F.mm&&F.mm!=="rebuy"){ put("tx",null,{club:e.c.id,kind:F.mm==="fix"?"adjust":F.mm,amt:F.mm==="fix"?e.diff:Math.abs(e.diff),at:now,source:"balance_check",session:sid}); }
  if(e.diff&&F.mm==="rebuy"&&F.past){ /* past sessions fold the difference into what went in */ }
  const shots=F.shots.slice(); const sess=get(sid);
  if(shots.length) await queueShots(shots,sid);
  V.tab="play"; go("done",{sid,shots:shots.length});
};

/* ============================================================ screenshots: queue, upload, read */
function compress(file,maxH){ maxH=maxH||1800; return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ const sc=Math.min(1,maxH/Math.max(img.width,img.height)); const cv=document.createElement("canvas"); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(u); res(cv.toDataURL("image/jpeg",0.78)); }; img.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("image")); }; img.src=u; }); }
const dataUrlToBlob=d=>{ const [h,b]=d.split(","); const mime=(h.match(/:(.*?);/)||[,"image/jpeg"])[1]; const bin=atob(b); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:mime}); };
async function queueShots(shots,sid){
  if(MODE==="claude"){ READQ=shots.map(x=>({id:uid(),file:x.file,taken_at:x.taken_at,session:sid,local:true})); return; }
  for(const x of shots){ try{ const img=await compress(x.file); DB.shots.push({id:uid(),session:sid,taken_at:x.taken_at,img}); }catch(e){ console.error(e); } }
  persist(); if(ACC.on) uploadShots();
}

let sampleFn=null;
async function startReading(items){
  if(!items.length) return;
  V.reading=items.map(x=>Object.assign({},x,{status:"wait"})); V.tab="review"; go("reading",{});
  if(!sampleFn){ try{ sampleFn=await window.claude.use("sample"); }catch(e){ sampleFn=null; } }
  if(!sampleFn){ V.reading.forEach(r=>{ r.status="fail"; r.msg=t("read.noClaude"); }); render(); return; }
  V.busy=true;
  const p=prof();
  // pass 1: identify each screenshot (one image per call is the most reliable)
  for(const r of V.reading){
    r.status="reading"; render();
    try{
      if(!r.blob){ if(r.file) r.blob=await compress(r.file).then(dataUrlToBlob); else { const d=await remote.shotImg(r.id); if(!d) throw new Error("gone"); r.blob=dataUrlToBlob(d); } }
      const idr=await sampleFn.json(`This is a phone screenshot. Is it a ClubGG poker hand replay or hand history screen? If yes, read the hand number shown at the top (digits after #). Reply only JSON: {"is_replay":true,"hand_id":"1628985529"}`,{images:[r.blob],modelTier:"quick",cache:false});
      r.isReplay=!!(idr&&idr.is_replay); r.hid=idr&&idr.hand_id?String(idr.hand_id).replace(/\D/g,""):null;
      r.status=r.isReplay?"idok":"skip"; if(!r.isReplay) r.msg=t("read.notReplay");
    }catch(e){ r.status="fail"; r.msg=e&&e.code==="rate_limited"?t("read.limit"):t("read.fail"); if(e&&e.code==="rate_limited") break; }
  }
  // pass 2: one full read per hand, with all of that hand's screenshots
  const groups={}; V.reading.filter(r=>r.status==="idok").forEach((r,i)=>{ const k=r.hid||("x"+i); (groups[k]=groups[k]||[]).push(r); });
  for(const k in groups){ const g=groups[k]; g.slice(1).forEach(r=>{ r.status="dup"; r.dupOf=k; });
    const lead=g[0]; lead.status="reading"; render();
    const exist=k[0]!=="x"&&hands().find(h=>h.clubgg_id===k);
    if(exist){ lead.status="exists"; lead.hand=exist.id; g.forEach(r=>markShotDone(r,exist.id)); continue; }
    try{
      const data=await sampleFn.json(parsePrompt(p.name),{images:g.map(r=>r.blob),cache:false});
      const h=normalizeHand(data,p.name); h.session=lead.session||null; h.at=lead.taken_at||nowISO(); const ses=h.session&&get(h.session); if(ses) h.club=ses.club;
      const hid=put("hand",null,h); lead.hand=hid; lead.status=h.warnings.length?"warn":"ok"; lead.h=h;
      g.forEach(r=>markShotDone(r,hid));
    }catch(e){ lead.status="fail"; lead.msg=e&&e.code==="rate_limited"?t("read.limit"):t("read.fail"); if(e&&e.code==="rate_limited") break; }
    render();
  }
  V.reading.filter(r=>r.status==="skip").forEach(r=>markShotDone(r,null));
  V.busy=false; render();
}
function markShotDone(r,hid){ READQ=READQ.filter(x=>x.id!==r.id); if(r.remote){ DB.remoteShots=DB.remoteShots.filter(x=>x.id!==r.id); remote.markShot(r.id,"read",hid).catch(console.error); } }

function parsePrompt(hero){
  return `You are reading screenshots of ONE poker hand from the ClubGG app's hand replay screen (No-Limit Hold'em). Several screenshots may show the same hand at different scroll positions; merge them.
The hero is named "${hero}". In the replay, the hero's actions appear as yellow speech bubbles with no name; other players' actions show their name and position badge.
Layout: the top shows the table name and hand number (#digits). Seats show each player's name and stack AFTER the hand ended. The action list has columns "Blinds(Ante)", "Pre-Flop", "Flop", "Turn", "River"; the number under each header is the pot at the START of that street (River shows the final pot). "All Ante N" is the TOTAL ante from all players. "Raise N" means raise TO a total of N for that street. "Call N" is the additional amount called. "(All-in) N" is an all-in. "Return N" is an uncalled bet returned. Positions: UTG, UTG+1, MP (also shown as UTG+2), HJ, CO, BTN, SB, BB. Cards: ranks A K Q J T 9..2 (write 10 as T), suits s h d c; a card "Kc", a hand "Kc9c", a board "Th Qh Jc Tc 2c".
Reply with ONLY one JSON object, in exactly this shape:
{"clubgg_hand_id":"512385440","table_name":"text","sb":1,"bb":2,"ante_total":0,"num_players":7,
 "hero":{"position":"HJ","cards":"Kc9c","stack_end":135},
 "board":"Th Qh Jc Tc 2c",
 "players":[{"name":"Romero55","position":"SB","stack_end":169,"shown_cards":"8s8c"}],
 "actions":[{"street":"preflop","player":"Romero55","position":"SB","action":"post_sb","amount":1}],
 "street_pots":{"preflop":3,"flop":47,"turn":135,"river":135},
 "pot_final":135,"winner":"name","went_to_showdown":true,
 "hero_invested":45,"hero_result":89,"notes":"anything unreadable or uncertain, else empty"}
Rules: "players" lists every seat including the hero; "shown_cards" null unless revealed. "actions" lists every action in order including post_sb and post_bb (not antes); action is one of post_sb, post_bb, fold, check, call, bet, raise, all_in, return; amount null for fold and check. Use "${hero}" as the hero's "player". hero_invested = all chips the hero put in. hero_result = hero's winnings minus hero_invested (negative if lost). If a number is cut off, estimate it and say so in "notes".`;
}
const normCards=s=>{ if(!s) return ""; const x=String(s).replace(/10/g,"T").replace(/[^2-9TJQKAshdc]/gi,""); return (x.match(/../g)||[]).map(c=>c[0].toUpperCase()+c[1].toLowerCase()).join(" "); };
const POS=["UTG","UTG+1","MP","HJ","CO","BTN","SB","BB"];
function normalizeHand(d,hero){
  const isHero=n=>String(n||"").trim().toLowerCase()===String(hero||"").trim().toLowerCase();
  const who=n=>isHero(n)?"hero":fnv(n);
  const pos=p=>{ p=String(p||"?").toUpperCase(); return p==="UTG+2"?"MP":p; };
  const h={v:1,source:"shot",game:"cash",review:null};
  h.clubgg_id=d.clubgg_hand_id?String(d.clubgg_hand_id).replace(/\D/g,""):null;
  h.table=d.table_name||null; h.sb=Number(d.sb)||0; h.bb=Number(d.bb)||0; h.n=Number(d.num_players)||(d.players||[]).length;
  h.pos=pos(d.hero&&d.hero.position); h.cards=normCards(d.hero&&d.hero.cards).replace(/\s/g,"");
  h.board=normCards(d.board); h.pot=Number(d.pot_final)||null; h.result=Number(d.hero_result)||0; h.showdown=!!d.went_to_showdown;
  h.winner=d.winner?who(d.winner):null; h.notes=d.notes||"";
  // opponent names are replaced by a short code on the way in: we never keep a database of other players
  h.players=(d.players||[]).map(p=>({who:who(p.name),pos:pos(p.position),stack:p.stack_end!=null?Number(p.stack_end):null,shown:p.shown_cards?normCards(p.shown_cards).replace(/\s/g,""):null}));
  const contrib={}; let pot=Number(d.ante_total)||0, street="preflop"; const acts=[];
  (d.actions||[]).forEach(a=>{ const s=a.street||street; if(s!==street){ street=s; for(const x in contrib) delete contrib[x]; }
    const w=who(a.player); let act=String(a.action||"").toLowerCase().replace(/[\s-]/g,"_"); if(act==="allin") act="all_in";
    if(!["post_sb","post_bb","fold","check","call","bet","raise","all_in","return"].includes(act)) act="bet";
    const amt=a.amount==null?null:Number(a.amount);

    acts.push({st:s,who:w,pos:pos(a.position),a:act,amt}); });
  h.actions=acts;
  const W=h.warnings=[];
  if(!/^[2-9TJQKA][shdc][2-9TJQKA][shdc]$/.test(h.cards)) W.push(t("warn.cards"));
  if(!POS.includes(h.pos)) W.push(t("warn.pos"));
  const all=[h.cards,(h.board||"").replace(/\s/g,"")].join("").match(/../g)||[]; if(new Set(all).size!==all.length) W.push(t("warn.dup"));
  if(h.pot&&Math.abs(pot-h.pot)>Math.max(2,h.pot*0.02)) W.push(t("warn.pot",{a:fmtN(pot),b:fmtN(h.pot)}));
  if(!h.clubgg_id) W.push(t("warn.id"));

function heroLastIdx(h){ let k=-1; (h.actions||[]).forEach((a,i)=>{ if(a.who==="hero"&&!["post_sb","post_bb","return"].includes(a.a)) k=i; }); return k; }

function streetRows(h,upto,revealed){

    const idx=acts.map((a,i)=>[a,i]).filter(([a])=>a.st===st); if(!idx.length) return;
    const potStart=pot;
    const vis=idx.filter(([a,i])=>revealed||i<=upto), hid=idx.length-vis.length;
    idx.forEach(([a])=>{ if(a.a==="raise"){ pot+=Math.max(0,(a.amt||0)-(contrib[st+a.who]||0)); contrib[st+a.who]=a.amt||0; } else if(a.a==="return") pot-=a.amt||0; else if(a.amt&&a.a!=="fold"&&a.a!=="check"){ pot+=a.amt; contrib[st+a.who]=(contrib[st+a.who]||0)+a.amt; } });
    if(!vis.length) { if(!revealed) return; }
    const shown=vis.filter(([a])=>!(a.a==="fold"&&a.who!=="hero")&&!(st==="preflop"&&(a.a==="post_sb"||a.a==="post_bb")));
    const nb=boardAt(h,st).slice(st==="flop"?0:st==="turn"?3:st==="river"?4:0);
    const key=!revealed&&vis.length&&vis[vis.length-1][1]===upto;
    rows.push(`<div class="street ${key?"key":""}"><span class="lab">${t("st."+st)}</span><span>${nb.length?`${boardTxt(nb.join(" "))} · `:""}${potStart>0?`<span class="muted">${t("rh.pot",{x:`<bdi class="num">${fmtN(potStart)}</bdi>`})}</span>. `:""}${shown.map(([a])=>actLine(a)).join(", ")}${shown.length?".":""}${!revealed&&hid?` <span class="muted">…</span>`:""}</span></div>`);

    ${F.grade?`<details class="more" ${F.note?"open":""}><summary>${t("rh.note")}</summary><textarea class="inp" data-f="note" style="margin-top:6px">${esc(F.note)}</textarea></details>`:""}</div>`;
  const reveal=F.revealed?revealBox(h,k):"";

async function saveFile(name,text,mime){
  if(MODE==="claude"){ try{ const d=await window.claude.use("downloads"); if(d){ await d.save({filename:name,data:new Blob([text],{type:mime})}); return; } }catch(e){ if(e&&e.code==="declined") return; } toast("Download isn't available here."); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
const csvCell=v=>{ const s=v==null?"":String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
ACT.exportCsv=()=>{ const rows=[["date","type","club","stake","hours","in","out","net","currency","plan","plan_kept","rating","note"]];

  txs().slice().reverse().forEach(x=>{ const c=clubOf(x.club); rows.push([x.at.slice(0,16).replace("T"," "),x.kind,c.name,"","",x.kind==="deposit"?toCur(x.amt,c):"",x.kind==="withdrawal"?toCur(x.amt,c):"",toCur(txSigned(x),c),cur(),"",x.off?"off-plan":"","",x.note||""]); });
  saveFile(`poker-ledger-${new Date().toISOString().slice(0,10)}.csv`,"﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\n"),"text/csv"); };
ACT.exportJson=()=>{ const out={app:"poker-ledger",version:2,exported:nowISO(),entries:Object.values(DB.entries).filter(e=>!e.deleted)}; saveFile(`poker-ledger-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(out),"application/json"); };

/* ============================================================ study tools: equity + ranges */
const RANKS="23456789TJQKA", SUITS="shdc";
function parseCards(s){ s=(s||"").replace(/10/g,"T").replace(/\s+/g,""); const out=[]; for(let i=0;i+1<s.length;i+=2){ const r=RANKS.indexOf(s[i].toUpperCase()), su=SUITS.indexOf(s[i+1].toLowerCase()); if(r<0||su<0) throw new Error(t("eq.bad",{c:s.slice(i,i+2)})); out.push(r*4+su); } return out; }
function eval7(cards){
  const rc=new Array(13).fill(0), sc=new Array(4).fill(0), sr=[[],[],[],[]]; let rb=0;
  for(const c of cards){ const r=c>>2,s=c&3; rc[r]++; sc[s]++; sr[s].push(r); rb|=1<<r; }
  const sh=b=>{ for(let h=12;h>=4;h--) if(((b>>(h-4))&31)===31) return h; return (b&0x100F)===0x100F?3:-1; };
  for(let s=0;s<4;s++) if(sc[s]>=5){ let b=0; sr[s].forEach(r=>b|=1<<r); const x=sh(b); if(x>=0) return 8e6+x; return 5e6+sr[s].sort((a,b)=>b-a).slice(0,5).reduce((a,r)=>a*13+r,0); }
  const g=[]; for(let r=12;r>=0;r--) if(rc[r]) g.push([rc[r],r]); g.sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  const kick=(n,ex)=>{ const q=[]; for(let r=12;r>=0&&q.length<n;r--) if(rc[r]&&!ex.includes(r)) q.push(r); return q.reduce((a,r)=>a*13+r,0); };
  if(g[0][0]===4) return 7e6+g[0][1]*13+kick(1,[g[0][1]]);
  if(g[0][0]===3&&g[1]&&g[1][0]>=2) return 6e6+g[0][1]*13+g[1][1];
  const st=sh(rb); if(st>=0) return 4e6+st;
  if(g[0][0]===3) return 3e6+g[0][1]*169+kick(2,[g[0][1]]);
  if(g[0][0]===2&&g[1]&&g[1][0]===2) return 2e6+g[0][1]*169+g[1][1]*13+kick(1,[g[0][1],g[1][1]]);
  if(g[0][0]===2) return 1e6+g[0][1]*2197+kick(3,[g[0][1]]);
  return kick(5,[]);
}
function equity(hero,board,opp,vil,iters){
  const used=new Set([...hero,...board,...(vil||[])]), deck=[]; for(let c=0;c<52;c++) if(!used.has(c)) deck.push(c);
  let win=0,tie=0; const need=5-board.length; if(need===0) iters=1;
  for(let it=0;it<iters;it++){
    for(let i=deck.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [deck[i],deck[j]]=[deck[j],deck[i]]; }
    const b=board.concat(deck.slice(0,need)); let q=need; const hv=eval7(hero.concat(b)); let best=-1,n=0;
    for(let o=0;o<opp;o++){ const oc=(o===0&&vil)?vil:[deck[q++],deck[q++]]; const v=eval7(oc.concat(b)); if(v>best){best=v;n=1;} else if(v===best) n++; }
    if(hv>best) win++; else if(hv===best) tie+=1/(n+1);
  }
  return {win:win/iters,tie:tie/iters};
}
Object.assign(L,{
  "eq.title":["Equity calculator","מחשבון אקוויטי"],"eq.hand":["Your hand","היד שלך"],"eq.board":["Board","בורד"],"eq.vil":["His hand","היד שלו"],"eq.opp":["Opponents","יריבים"],
  "eq.go":["Calculate","חישוב"],"eq.vs":["vs {x}","מול {x}"],"eq.rand":["{n} random hands","{n} ידיים אקראיות"],"eq.rand1":["1 random hand","יד אקראית אחת"],"eq.that":["that hand","היד הזאת"],
  "eq.wt":["Win {w}% · tie {t}%. To call a bet B into pot P you need B ÷ (P + 2B): 25% for half pot, 33% for pot.","ניצחון {w}% · תיקו {t}%. כדי לקרוא להימור B לקופה P צריך B ÷ (P + 2B): 25% לחצי קופה, 33% לקופה מלאה."],
  "eq.bad":["\"{c}\" isn't a card. Use rank + suit, like Kc or Th.","\"{c}\" הוא לא קלף. כתוב דרגה + צורה, כמו Kc או Th."],

  "rg.title":["Opening ranges","טווחי פתיחה"],"rg.sub":["A common 8-handed starting point when it's folded to you. Gold: open. Dim: open at a loose table. Tap a hand to see its equity.","נקודת פתיחה מקובלת ל-8 שחקנים כשמקפלים אליך. זהב: לפתוח. עמום: לפתוח בשולחן רופף. הקש על יד כדי לראות אקוויטי."],

ACT.openEq=(b,e,pre)=>{ openSheet(t("eq.title"),`<div class="duo"><label class="f">${t("eq.hand")}<input class="inp sm" id="eqH" placeholder="AhKd" autocapitalize="off" value="${esc(pre||"")}"></label><label class="f">${t("eq.board")}<input class="inp sm" id="eqB" placeholder="Jd Kd 7h" autocapitalize="off"></label>
    <label class="f">${t("eq.vil")} <input class="inp sm" id="eqV" placeholder="${t("optional")}" autocapitalize="off"></label><label class="f">${t("eq.opp")}<input class="inp sm" id="eqO" inputmode="numeric" value="1"></label></div><div id="eqOut"></div>`,
  `<button class="btn primary" id="eqGo">${t("eq.go")}</button>`,()=>{ $("eqGo").onclick=()=>{ try{
    const hero=parseCards($("eqH").value); if(hero.length!==2) throw new Error(t("eq.two"));
    const board=parseCards($("eqB").value); if(![0,3,4,5].includes(board.length)) throw new Error(t("eq.bn"));
    const vil=$("eqV").value.trim()?parseCards($("eqV").value):null; if(vil&&vil.length!==2) throw new Error(t("eq.vn"));
    const all=[...hero,...board,...(vil||[])]; if(new Set(all).size!==all.length) throw new Error(t("eq.dupc"));
    const opp=Math.max(1,Math.min(8,num($("eqO").value)||1)); const r=equity(hero,board,opp,vil,board.length===5?1:20000); const eq=(r.win+r.tie)*100;
    $("eqOut").innerHTML=`<div class="row" style="justify-content:flex-start;align-items:baseline;gap:12px"><span class="big">${eq.toFixed(1)}%</span><span class="small muted">${t("eq.vs",{x:vil?t("eq.that"):opp===1?t("eq.rand1"):t("eq.rand",{n:opp})})}</span></div>
      <div class="eqbar"><i style="width:${(r.win*100).toFixed(1)}%;background:var(--good)"></i><i style="width:${(r.tie*100).toFixed(1)}%;background:var(--warn)"></i></div><span class="tiny muted">${t("eq.wt",{w:(r.win*100).toFixed(1),t:(r.tie*100).toFixed(1)})}</span>`;
  }catch(err){ $("eqOut").innerHTML=`<div class="note bad">${esc(err.message)}</div>`; } }; if(pre) $("eqGo").click(); }); };
const RANGES={
  UTG:"77+ AJs+ KQs AQo+ ATs KJs | 66 A9s QJs JTs AJo KQo",
  HJ:"66+ ATs+ KJs+ QJs JTs AJo+ KQo | 55 A8s KTs QTs T9s 98s ATo",
  CO:"44+ A7s+ K9s+ Q9s+ J9s+ T9s 98s 87s ATo+ KJo+ QJo | 22+ A2s+ K7s+ Q8s+ T8s 97s 86s 76s 65s A9o KTo QTo JTo",
  BTN:"22+ A2s+ K5s+ Q7s+ J8s+ T8s+ 97s+ 86s+ 75s+ 65s 54s A7o+ K9o+ Q9o+ J9o+ T9o | K2s+ Q4s+ J6s+ T7s 96s 85s 74s 64s 53s A2o+ K7o+ Q8o+ J8o+ T8o 98o",
  SB:"22+ A2s+ K6s+ Q8s+ J8s+ T8s+ 97s+ 87s 76s A8o+ KTo+ QTo+ JTo | K2s+ Q5s+ J7s+ T7s 96s 86s 75s 65s A5o+ K9o+ Q9o+ J9o T9o"};
function expand(spec){ const set=new Set(); spec.split(/\s+/).filter(Boolean).forEach(x=>{ const plus=x.endsWith("+"); x=x.replace("+",""); const a=RANKS.indexOf(x[0]),b=RANKS.indexOf(x[1]),ty=x[2]||""; if(a===b){ for(let r=a;r<=(plus?12:a);r++) set.add(RANKS[r]+RANKS[r]); } else { const hi=Math.max(a,b), lo=Math.min(a,b); for(let l=lo;l<=(plus?hi-1:lo);l++) set.add(RANKS[hi]+RANKS[l]+ty); } }); return set; }
ACT.openRanges=()=>{ let pos="CO";
  const grid=()=>{ const [o,m]=RANGES[pos].split("|").map(expand); let h=""; for(let i=12;i>=0;i--) for(let j=12;j>=0;j--){ const hi=Math.max(i,j), lo=Math.min(i,j), suited=j>i, pair=i===j; const key=RANKS[hi]+RANKS[lo]+(pair?"":suited?"s":"o"); h+=`<button class="${o.has(key)?"o":m.has(key)?"m":""}" data-k="${key}" data-c="${RANKS[hi]}s${RANKS[lo]}${pair?"h":suited?"s":"h"}">${key}</button>`; } return h; };
  openSheet(t("rg.title"),`<span class="small muted">${t("rg.sub")}</span><div class="seg" id="rgPos">${Object.keys(RANGES).map(p=>`<button class="chip" data-v="${p}" aria-pressed="${p===pos}">${p}</button>`).join("")}</div><div class="grid13" id="rgGrid">${grid()}</div>`,"",()=>{
    $("rgPos").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; pos=b.dataset.v; $("rgPos").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); $("rgGrid").innerHTML=grid(); };
    $("rgGrid").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; const c=b.dataset.c; closeSheet(); ACT.openEq(null,null,c); }; }); };

/* ============================================================ sheet */
let sheetCleanup=null, lastFocus=null;
function openSheet(title,body,foot,mount){
  closeSheet(); lastFocus=document.activeElement;
  const w=document.createElement("div"); w.className="sheetwrap"; w.id="sheetWrap";
  w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sh"><h2 id="sheetTitle">${title}</h2><button class="iconbtn" id="sheetX" aria-label="${t("close")}">${ICON.x}</button></div><div class="sb" id="sheetBody">${body}</div>${foot?`<div class="sf" id="sheetFoot">${foot}</div>`:""}</div>`;
  document.body.appendChild(w); document.body.style.overflow="hidden";
  w.addEventListener("click",e=>{ if(e.target===w) closeSheet(); }); $("sheetX").onclick=closeSheet;
  const first=w.querySelector("input.inp:not([type=file])"); if(first&&!("ontouchstart" in window)) first.focus();
  sheetCleanup=mount?mount():null;
}
function closeSheet(){ const w=$("sheetWrap"); if(!w) return; w.remove(); document.body.style.overflow=""; if(typeof sheetCleanup==="function") sheetCleanup(); sheetCleanup=null; if(lastFocus&&document.contains(lastFocus)) lastFocus.focus(); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

/* ============================================================ boot */
VIEWS.loading=()=>`<div class="status"><span class="spin" aria-label="Loading"></span></div>`;
async function boot(){
  lang=lsGet("lang")||((navigator.language||"").startsWith("he")?"he":"en");
  await IDB.open();
  const saved=await IDB.get("db"); if(saved&&saved.entries){ DB.entries=saved.entries; DB.dirty=saved.dirty||{}; DB.since=saved.since||null; DB.owner=saved.owner||null; }
  DB.shots=(await IDB.get("shots"))||[];
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  let user=null; try{ user=await remote.init(); }catch(e){ console.error("remote",e); }
  if(user){
    if(DB.owner&&DB.owner!==user.id){ DB.entries={}; DB.dirty={}; DB.since=null; DB.shots=[]; }
    if(!DB.owner){ for(const id in DB.entries) DB.dirty[id]=1; }
    DB.owner=user.id; ACC.on=true; ACC.uid=user.id; ACC.email=user.email; persist();
    try{ await sync(); }catch(e){}
  }
  const p=prof(); if(p&&p.lang&&!lsGet("lang")) lang=p.lang;
  applyPending();
  V.view=p?(liveS()?"live":"play"):"first"; V.tab="play"; BOOTED=true;
  render();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ applyPending(); if(ACC.on) scheduleSync(300); if(!V.busy&&!document.getElementById("sheetWrap")&&["play","live","review","money"].includes(V.view)) render(); } });
  window.addEventListener("online",()=>scheduleSync(300));
}
boot();
